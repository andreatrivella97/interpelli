# Scuole controllate e pagine in cui pubblicano gli interpelli.
#
# Per aggiungere una scuola basta copiare un blocco e cambiare i dati. Ogni scuola ha una o
# piu' "fonti", lette in ordine:
#
#   tipo: pagina   una pagina del sito con l'elenco degli interpelli (link a PDF o a notizie)
#                  opzioni: righe: true   -> tabella in cui ogni riga e' un interpello senza link
#                           filtro: "..." -> prende solo i link che contengono queste parole
#   tipo: axios    cruscotto "Interpelli" del portale Axios; cf = codice fiscale della scuola
#   tipo: albo     albo online dei siti ospitati da Spaggiari (ricerca "interpell")
#   tipo: wp       notizie di un sito WordPress che parlano di interpello
#
# "manuale" indica dove guardare a mano quando la scuola pubblica (anche) su un portale che
# non consente la lettura automatica.
#
# Elenco ricavato dall'anagrafe ministeriale 2026/27 per i comuni indicati.

