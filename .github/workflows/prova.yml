name: Prova

# Sui rami di lavoro (claude/...) esegue i test e un controllo vero dei siti, senza toccare
# la pagina pubblicata: il risultato finisce nel ramo "prova-output", dove si puo' esaminare.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prova
  cancel-in-progress: true

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Strumenti per leggere i PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ita
      - run: pip install -q -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -t . -v
      - name: Controllo dei siti
        env:
          INTERPELLI_SALVA: /tmp/uscita/copie
        run: |
          mkdir -p /tmp/uscita
          python -m scraper 2>&1 | tee /tmp/uscita/registro.txt
      - name: Deposita il risultato nel ramo prova-output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/uscita
          cp -r docs stato /tmp/uscita/ 2>/dev/null || true
          cd /tmp/uscita
          git init -q -b prova-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prova $(date -u +%FT%TZ) da ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prova-output
