name: Orologio

# GitHub fa partire i flussi "programmati" solo quando ha posto: nelle prime dieci ore di vita
# di questo progetto ha rispettato due partenze su trenta. Questo flusso fa da orologio al posto
# suo: ogni giro aspetta venti minuti, poi fa partire "Aggiorna interpelli" e rilancia se stesso.
#
# L'attesa non tiene occupato nessun computer: e' una regola dell'ambiente "attesa", che va
# impostata a mano una volta sola in Settings > Environments > attesa > Wait timer (20 minuti).
# Senza quella regola il giro si ferma subito e non si rilancia.
#
# Non serve avviarlo: se non c'e' un giro in attesa lo fa partire "Aggiorna interpelli" alla fine
# di ogni controllo, e cosi' riparte da solo anche dopo un intoppo.
# Per fermarlo: Actions > Orologio > "..." > Disable workflow.

on:
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo per prova: fa partire il controllo una volta e non si rilancia'
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: attesa          # e' qui che il giro aspetta
    steps:
      - name: Rilancia l'orologio e fa partire il controllo
        env:
          GH_TOKEN: ${{ github.token }}
          PROVA: ${{ inputs.prova }}
        run: |
          # Tre tentativi per ogni richiesta a GitHub: un intoppo passeggero non deve fermare l'orologio.
          leggi() {
            local tentativo risposta
            for tentativo in 1 2 3; do
              if risposta=$(gh api "$@"); then printf '%s\n' "$risposta"; return 0; fi
              sleep 20
            done
            return 1
          }
          avvia() {
            local tentativo
            for tentativo in 1 2 3; do
              gh workflow run "$@" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && return 0
              sleep 20
            done
            return 1
          }
          # Il controllo parte come quelli programmati: rilegge solo le scuole non lette nell'ultima ora.
          controllo() { avvia aggiorna.yml -f completo=false; }

          if [ "$PROVA" = "true" ]; then
            controllo
            exit 0
          fi

          # Quanto ha aspettato questo giro? Se non ha aspettato, la regola dell'attesa non c'e' e
          # rilanciarsi vorrebbe dire partire a raffica: ci si rilancia solo quando l'attesa e' certa.
          creato=$(leggi "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || creato=""
          if ! [[ "$creato" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]]; then
            echo "::error::Non si riesce a sapere quanto ha aspettato questo giro: l'orologio si ferma, lo fara' ripartire il prossimo controllo."
            exit 1
          fi
          attesa=$(( $(date +%s) - $(date -d "$creato" +%s) ))
          echo "Questo giro ha aspettato $(( attesa / 60 )) minuti prima di partire."
          if [ "$attesa" -lt 300 ]; then
            echo "::warning::L'ambiente \"attesa\" non ha un'attesa di almeno 5 minuti: l'orologio si ferma qui. Va impostata in Settings > Environments > attesa > Wait timer (20 minuti)."
            exit 0
          fi

          # Se e' gia' in coda un giro piu' recente (qualcuno ha avviato l'orologio una seconda volta),
          # sara' quello a continuare: questo fa solo partire il controllo. Cosi' l'orologio resta uno.
          limite=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          altri=$(leggi "repos/$GITHUB_REPOSITORY/actions/workflows/orologio.yml/runs?per_page=30" --jq \
            "[.workflow_runs[] | select(.status != \"completed\" and .id > $GITHUB_RUN_ID and .created_at > \"$limite\")] | length") || altri=""
          esito=0
          if [[ "$altri" =~ ^[1-9][0-9]*$ ]]; then
            echo "C'e' gia' un giro piu' recente in attesa: l'orologio continua con quello."
          else
            avvia orologio.yml || esito=1
          fi
          # Anche se il rilancio non e' riuscito il controllo parte lo stesso: sara' lui a far ripartire l'orologio.
          controllo || esito=1
          exit $esito
