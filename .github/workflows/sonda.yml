name: Sonda siti (sviluppo)

# Strumento di messa a punto: scarica gli indirizzi elencati in
# tools/sonda_urls.txt e salva le risposte grezze sul ramo "sonda-output".

on:
  push:
    branches: ['claude/**']
    paths:
      - 'tools/sonda_urls.txt'
      - 'tools/sonda.py'
      - '.github/workflows/sonda.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonda
  cancel-in-progress: true

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -q requests
      - name: Scarica gli indirizzi
        run: python tools/sonda.py tools/sonda_urls.txt out
      - name: Salva i risultati sul ramo sonda-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b sonda-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sonda $(date -u +%FT%TZ) da ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sonda-output
